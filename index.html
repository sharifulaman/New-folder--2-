<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sets the theme before first paint to avoid a flash of the wrong theme.
         "portfolio-theme" must match THEME_STORAGE_KEY in src/context/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Shariful Aman" />

    <title>Shariful Aman — Software Engineer</title>
    <meta
      name="description"
      content="Shariful Aman is a software engineer building scalable web, mobile, and backend products with modern engineering practices."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.sharifulaman.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shariful Aman — Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer building scalable web, mobile, and backend products with modern engineering practices."
    />
    <meta property="og:url" content="https://www.sharifulaman.dev/" />
    <meta property="og:image" content="https://www.sharifulaman.dev/images/profile/shariful.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shariful Aman — Software Engineer" />
    <meta
      name="twitter:description"
      content="Software engineer building scalable web, mobile, and backend products with modern engineering practices."
    />
    <meta name="twitter:image" content="https://www.sharifulaman.dev/images/profile/shariful.svg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Shariful Aman",
        "jobTitle": "Software Engineer",
        "url": "https://www.sharifulaman.dev/",
        "sameAs": [
          "https://linkedin.com/in/sharifulaman",
          "https://github.com/sharifulaman",
          "https://x.com/sharifulaman"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
